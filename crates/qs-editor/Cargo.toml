[package]
name = "qs-editor"
version = "0.1.0"
edition = "2021"
license.workspace = true
description = "Standalone annotation editor window (egui)"

[dependencies]
anyhow.workspace = true
image.workspace = true
qs-doc.workspace = true
qs-theme.workspace = true
qs-render.workspace = true
qs-edit.workspace = true
arboard = "3"
eframe = { version = "0.37", default-features = false, features = ["glow", "x11", "wayland", "default_fonts"] }
rfd = { version = "0.15", default-features = false, features = ["gtk3"] }
