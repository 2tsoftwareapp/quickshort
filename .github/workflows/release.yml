name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Optional check against the app version in Cargo.toml"
        required: false
      installer_preview:
        description: "Build setup previews as workflow artifacts"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  metadata:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: record build version and commit
        id: version
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
          INSTALLER_PREVIEW: ${{ inputs.installer_preview }}
        run: |
          VER="$(sed -n 's/^version = "\(.*\)"/\1/p' crates/qs-app/Cargo.toml | head -1)"
          [[ "$VER" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Invalid app version: $VER"; exit 1; }
          if [[ -n "$REQUESTED_VERSION" && "${REQUESTED_VERSION#v}" != "$VER" ]]; then
            echo "Requested version must match the app version ($VER)."
            exit 1
          fi
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          jq -n --arg version "$VER" --arg sha "$GITHUB_SHA" --argjson preview "$INSTALLER_PREVIEW" \
            '{version: $version, sha: $sha, installer_preview: $preview}' > release-context.json
      - uses: actions/upload-artifact@v4
        with:
          name: release-context
          path: release-context.json
          if-no-files-found: error

  macos:
    needs: metadata
    runs-on: macos-latest
    env:
      DEV_ID_P12_B64: ${{ secrets.QS_DEV_ID_APPLICATION_P12 }}
      DEV_ID_P12_PASSWORD: ${{ secrets.QS_DEV_ID_APPLICATION_P12_PASSWORD }}
      NOTARY_P8_B64: ${{ secrets.QS_NOTARY_P8_B64 }}
      NOTARY_KEY_ID: ${{ secrets.QS_NOTARY_KEY_ID }}
      NOTARY_ISSUER: ${{ secrets.QS_NOTARY_ISSUER }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin

      # Production macOS releases are strict: missing Apple credentials must
      # fail before compilation rather than silently produce unsigned artifacts.
      # Local self-signed/ad-hoc builds remain available through release.sh.
      - name: import Developer ID signing certificate
        run: |
          missing=""
          [ -n "$DEV_ID_P12_B64" ] || missing="$missing QS_DEV_ID_APPLICATION_P12"
          [ -n "$DEV_ID_P12_PASSWORD" ] || missing="$missing QS_DEV_ID_APPLICATION_P12_PASSWORD"
          if [ -n "$missing" ]; then
            echo "Missing required Apple signing secrets:$missing" >&2
            exit 1
          fi

          KEYCHAIN=qs-signing.keychain-db
          security create-keychain -p "" "$KEYCHAIN"
          security set-keychain-settings -t 3600 -l -u "$KEYCHAIN"
          security unlock-keychain -p "" "$KEYCHAIN"
          P12="$RUNNER_TEMP/QSDevIdApplication.p12"
          printf '%s' "$DEV_ID_P12_B64" | base64 -d > "$P12"
          security import "$P12" -k "$KEYCHAIN" \
            -P "$DEV_ID_P12_PASSWORD" -T /usr/bin/codesign
          # grant codesign the key partition — without this it pops a
          # SecurityAgent dialog and hangs the headless runner
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -k "" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          rm "$P12"

          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" \
            | awk -F '"' '/Developer ID Application:/ {print $2; exit}')"
          if [ -z "$IDENTITY" ]; then
            echo "QS_DEV_ID_APPLICATION_P12 did not provide a Developer ID Application identity." >&2
            exit 1
          fi
          echo "Using signing identity: $IDENTITY"
          echo "SIGNING_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"

      - name: configure notarization credentials
        run: |
          missing=""
          [ -n "$NOTARY_P8_B64" ] || missing="$missing QS_NOTARY_P8_B64"
          [ -n "$NOTARY_KEY_ID" ] || missing="$missing QS_NOTARY_KEY_ID"
          [ -n "$NOTARY_ISSUER" ] || missing="$missing QS_NOTARY_ISSUER"
          if [ -n "$missing" ]; then
            echo "Missing required notarization secrets:$missing" >&2
            exit 1
          fi
          printf '%s' "$NOTARY_KEY_ID" | grep -Eq '^[A-Z0-9]{10}$' || {
            echo "QS_NOTARY_KEY_ID is not a 10-character alphanumeric App Store Connect key ID." >&2
            exit 1
          }
          printf '%s' "$NOTARY_ISSUER" | grep -Eq '^[0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{12}$' || {
            echo "QS_NOTARY_ISSUER is not a UUID-shaped App Store Connect issuer ID." >&2
            exit 1
          }

          KEY="$RUNNER_TEMP/AuthKey.p8"
          printf '%s' "$NOTARY_P8_B64" | base64 -d > "$KEY"
          chmod 600 "$KEY"
          grep -q '^-----BEGIN PRIVATE KEY-----' "$KEY" || {
            echo "QS_NOTARY_P8_B64 did not decode to a PEM private key." >&2
            exit 1
          }
          echo "NOTARY_KEY=$KEY" >> "$GITHUB_ENV"
          echo "NOTARY_KEY_ID=$NOTARY_KEY_ID" >> "$GITHUB_ENV"
          echo "NOTARY_ISSUER=$NOTARY_ISSUER" >> "$GITHUB_ENV"

      - name: build + package
        env:
          QS_VERSION: ${{ needs.metadata.outputs.version }}
        run: packaging/macos/release.sh "$QS_VERSION"

      - name: build macOS setup preview
        if: inputs.installer_preview
        run: packaging/macos/installer.sh

      - uses: actions/upload-artifact@v4
        with:
          name: dist-macos
          path: dist/*
          if-no-files-found: error

  windows:
    needs: metadata
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: build
        run: cargo build --locked --release -p qs-app -p qs-editor

      # SignPath OSS signing: two rounds — the shipped binaries first, then
      # the installer carrying them. Gated on vars.SIGNPATH_ENABLED so the
      # job still produces an unsigned installer until the secrets exist.
      - name: upload unsigned binaries
        if: ${{ vars.SIGNPATH_ENABLED == 'true' }}
        id: unsigned-binaries
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-binaries
          path: |
            target/release/quickshort.exe
            target/release/qs-editor.exe
          if-no-files-found: error

      - name: sign binaries via SignPath
        if: ${{ vars.SIGNPATH_ENABLED == 'true' }}
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIG_SLUG }}
          github-artifact-id: ${{ steps.unsigned-binaries.outputs.artifact-id }}
          output-artifact-directory: signed-binaries

      - name: nsis installer
        shell: bash
        env:
          QS_VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          command -v makensis >/dev/null || choco install nsis -y --no-progress
          export PATH="$PATH:/c/Program Files (x86)/NSIS:/c/Program Files/NSIS"
          mkdir -p dist
          # Prefer SignPath-signed binaries when present.
          BIN_DIR=target/release
          [ -f signed-binaries/quickshort.exe ] && BIN_DIR=signed-binaries
          # -D not /D: git-bash mangles /DFOO into a C:/Program Files/Git path.
          # NSIS resolves relative paths against the script dir, so pass
          # absolute Windows paths via cygpath.
          makensis "-DVERSION=$QS_VERSION" \
            "-DBIN=$(cygpath -w "$PWD/$BIN_DIR/quickshort.exe")" \
            "-DEDITOR_BIN=$(cygpath -w "$PWD/$BIN_DIR/qs-editor.exe")" \
            "-DOUT=$(cygpath -w "$PWD/dist/Quickshort-Windows-Setup.exe")" \
            packaging/windows/installer.nsi

      - name: upload unsigned installer
        if: ${{ vars.SIGNPATH_ENABLED == 'true' }}
        id: unsigned-setup
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-setup
          path: dist/Quickshort-Windows-Setup.exe
          if-no-files-found: error

      - name: sign installer via SignPath
        if: ${{ vars.SIGNPATH_ENABLED == 'true' }}
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIG_SLUG }}
          github-artifact-id: ${{ steps.unsigned-setup.outputs.artifact-id }}
          output-artifact-directory: dist

      - name: checksum
        shell: bash
        run: |
          cd dist && sha256sum Quickshort-Windows-Setup.exe \
            > Quickshort-Windows-Setup.exe.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: dist-windows
          path: dist/*
          if-no-files-found: error

  linux:
    needs: metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev libayatana-appindicator3-dev \
            libgtk-layer-shell-dev libpipewire-0.3-dev libclang-dev pkg-config \
            libxkbcommon-x11-0

      - name: build + package
        env:
          QS_VERSION: ${{ needs.metadata.outputs.version }}
        run: packaging/linux/package.sh "$QS_VERSION"

      - name: build Linux setup preview
        if: inputs.installer_preview
        env:
          QS_VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          sudo apt-get install -y p7zip-full libgl1 libdbus-1-3 libfontconfig1 \
            libxkbcommon0 libx11-xcb1 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-sync1 libxcb-xfixes0 libxcb-shape0
          QT_IFW="$RUNNER_TEMP/quickshort-ifw"
          mkdir -p "$QT_IFW"
          ARCHIVE="$QT_IFW/qt-ifw.7z"
          curl -fLsS --retry 3 -o "$ARCHIVE" \
            'https://download.qt.io/online/qtsdkrepository/linux_x64/desktop/tools_ifw/qt.tools.ifw.47/4.7.0-0-202402150941ifw-linux-x64.7z'
          echo "dd86e6098e88baf0aad28a03334b505f8767eb45294b74d118d16a4a1d64f035  $ARCHIVE" | sha256sum -c -
          7z x -y "-o$QT_IFW" "$ARCHIVE" >/dev/null
          QT_IFW_BIN="$QT_IFW/Tools/QtInstallerFramework/4.7/bin" \
            packaging/linux/build-installer.sh "$QS_VERSION"

      - name: checksums
        run: |
          cd dist
          sha256sum Quickshort-Linux.AppImage* quickshort_amd64.deb \
            > linux.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: dist-linux
          path: dist/*
          if-no-files-found: error
